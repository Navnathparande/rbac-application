spring.application.name=rbac-backend
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/rbac_db?createDatabaseIfNotExist=true&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=rbac_user
spring.datasource.password=8080
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
app.jwt.secret=${JWT_SECRET:ChangeThisDevelopmentSecretToA32ByteMinimumKey!}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173}
app.admin.email=navnathparande99@gmail.com
app.admin.password=8080
logging.level.org.springframework.security=DEBUG
logging.level.com.example.rbac.security=DEBUG